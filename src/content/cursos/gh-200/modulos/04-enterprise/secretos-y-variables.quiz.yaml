preguntas:
  - id: precedencia
    enunciado: Una variable API_URL existe en organización, repo y environment. ¿Qué valor recibe un job que usa ese environment?
    opciones:
      - El de la organización
      - El del repo
      - El del environment
      - Falla por nombre duplicado
    correcta: 2
    explicacion: Gana el nivel más bajo, el environment. Le siguen el repo y la organización.
  - id: secreto-derivado
    enunciado: Un step calcula un token a partir de un secreto. ¿Cómo evitas que aparezca en los logs?
    opciones:
      - No hace falta, se enmascara solo
      - "Con ::add-mask:: antes de usarlo"
      - Guardándolo en GITHUB_OUTPUT
      - Guardándolo en vars
    correcta: 1
    explicacion: El runner enmascara los secretos usados en el job, pero un valor derivado es distinto y debe enmascararse con add-mask.
